<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard PKB/PLKB</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .data-card { background: #e9ecef; padding: 15px; border-radius: 4px; margin-top: 15px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Portal Pegawai PKB/PLKB</h2>
    
    <div id="login-section">
        <p>Silakan masukkan NIP Anda untuk melihat data:</p>
        <input type="number" id="inputNIP" placeholder="Masukkan 18 Digit NIP" required>
        <button onclick="loginNIP()">Cari Data Saya</button>
        <p id="pesan-error" style="color: red; display: none;">Data tidak ditemukan.</p>
    </div>

    <div id="dashboard-section" style="display: none;">
        <h3 style="color: green;">Login Berhasil!</h3>
        <div class="data-card">
            <p><strong>Nama Lengkap:</strong> <span id="tampil-nama"></span></p>
            <p><strong>NIP:</strong> <span id="tampil-nip"></span></p>
            <p><strong>Jabatan:</strong> <span id="tampil-jabatan"></span></p>
            <p><strong>Golongan:</strong> <span id="tampil-golongan"></span></p>
            <p><strong>Wilayah Tugas:</strong> <span id="tampil-wilayah"></span></p>
        </div>
        <button onclick="keluar()" style="background-color: #dc3545;">Keluar</button>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
